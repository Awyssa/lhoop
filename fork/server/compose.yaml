# The backup server. It publishes no port: the only way in is the reverse proxy, over a Docker network
# the two share and nothing else is on. See README.md.
services:
  api:
    build: .
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    pids_limit: 128
    environment:
      # Empty until `token new` has been run. The server refuses to start without it.
      LHOOP_TOKEN_SHA256: ${LHOOP_TOKEN_SHA256:-}
    volumes:
      - ./data:/data
    expose: ["8787"]
    networks:
      proxy:
        aliases: [lhoop-backup]
    healthcheck:
      test: ["CMD", "/lhoop-backup", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

networks:
  # Made once with `docker network create proxy`. The reverse proxy joins it too.
  proxy:
    external: true
